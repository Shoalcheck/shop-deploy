apiVersion: v1
kind: ServiceAccount
metadata: {name: ledger-exporter, namespace: payments}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: ledger-exporter, namespace: payments, labels: {app: ledger-exporter}}
spec:
  replicas: 2
  selector: {matchLabels: {app: ledger-exporter}}
  template:
    metadata: {labels: {app: ledger-exporter}}
    spec:
      serviceAccountName: ledger-exporter
      securityContext: {runAsNonRoot: true, runAsUser: 65532, seccompProfile: {type: RuntimeDefault}}
      topologySpreadConstraints:
        - {maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway, labelSelector: {matchLabels: {app: ledger-exporter}}}
      containers:
        - name: exporter
          image: registry.k8s.io/pause:3.10@sha256:ee6521f290b2168b6e0935a181d4cff9be1ac3f505666ef0e3c98fae8199917a
          resources: {requests: {cpu: 20m, memory: 32Mi}, limits: {memory: 64Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: ledger-exporter, namespace: payments}
spec:
  maxUnavailable: 1
  selector: {matchLabels: {app: ledger-exporter}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: ledger-exporter, namespace: payments}
rules:
  - {apiGroups: [""], resources: [configmaps], resourceNames: [ledger-export], verbs: [get]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: ledger-exporter, namespace: payments}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: ledger-exporter}
subjects: [{kind: ServiceAccount, name: ledger-exporter, namespace: payments}]
